<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pranav Sahu | Personal Profile</title>

  <style>

    /* -------------------------
       Page
    ------------------------- */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background-color: #f3eee7;
      color: #252525;
    }


    /* -------------------------
       Profile Card
    ------------------------- */

    .profile {
      width: 850px;
      min-height: 430px;

      display: flex;
      align-items: center;

      background-color: #ffffff;

      border: 1px solid #ddd5cc;
      border-radius: 20px;

      padding: 25px;
      gap: 45px;

      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.10);
    }


    /* -------------------------
       Profile Photo
    ------------------------- */

    .photo {
      width: 380px;
      height: 380px;

      flex-shrink: 0;

      overflow: hidden;

      border-radius: 15px;
    }

    .photo img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }


    /* -------------------------
       Profile Information
    ------------------------- */

    .info {
      flex: 1;
    }

    .info h1 {
      margin: 0 0 10px;

      font-size: 42px;
      color: #222222;
    }

    .info h2 {
      margin: 0 0 20px;

      font-size: 22px;
      font-weight: 500;

      color: #a67852;
    }

    .info p {
      margin: 0;

      font-size: 17px;
      line-height: 1.7;

      color: #666666;
    }


    /* -------------------------
       Small accent line
    ------------------------- */

    .line {
      width: 60px;
      height: 4px;

      margin-bottom: 20px;

      background-color: #c49a6c;

      border-radius: 10px;
    }


    /* -------------------------
       Responsive
    ------------------------- */

    @media (max-width: 800px) {

      .profile {
        width: 90%;
        flex-direction: column;

        text-align: center;

        gap: 25px;
      }

      .photo {
        width: 280px;
        height: 280px;
      }

      .line {
        margin-left: auto;
        margin-right: auto;
      }

      .info h1 {
        font-size: 34px;
      }

    }

  </style>
</head>


<body>

  <div class="profile">

    <!-- Photo -->

    <div class="photo">

      <img
        src="scripts/pp.png"
        alt="Profile photo of Pranav Sahu"
      >

    </div>


    <!-- Information -->

    <div class="info">

      <div class="line"></div>

      <h1>Pranav Sahu</h1>

      <h2>Aspiring Data Scientist</h2>

      <p>
        I am a B.Tech student with a strong interest in
        Python, Data Science, Artificial Intelligence and
        Machine Learning. I enjoy building practical projects,
        learning new technologies and turning ideas into
        working applications.
      </p>

    </div>

  </div>

</body>

</html>
