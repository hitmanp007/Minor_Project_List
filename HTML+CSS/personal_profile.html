<!DOCTYPE html>
<html lang="en">
<head>
<!-- ============================================================
     DIGITAL PROFILE / CONTACT CARDS — single-file build
     Edit the `profiles` array and `BASE_URL` inside the <script>
     section near the bottom to personalize this page.
     ============================================================ -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Profiles — Scan to Connect</title>
<meta name="description" content="Digital contact cards — scan to connect on LinkedIn, GitHub and Instagram." />

<!-- Fonts: a characterful display serif for names, a clean grotesk for body copy,
     and a mono face for badge-style labels (attendee numbers, section eyebrows). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Font Awesome for recognizable social icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<!-- QRCode.js — lightweight, client-side, canvas-based QR generation.
     Works entirely in the browser, no backend, GitHub Pages friendly. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  /* ==========================================================
     DESIGN TOKENS
     A graphite/ink "event badge" palette with a brass accent —
     chosen to feel like a printed conference credential rather
     than a generic gradient hero.
     ========================================================== */
  :root{
    --ink:        #14161c;
    --ink-2:      #191c23;
    --panel:      #1c1f28;
    --panel-2:    #20242e;
    --line:       rgba(237,239,242,0.09);
    --line-strong:rgba(237,239,242,0.16);
    --text:       #edeff2;
    --text-dim:   #9aa2b1;
    --text-faint: #656d7c;
    --gold:       #c9a961;
    --gold-soft:  rgba(201,169,97,0.14);
    --gold-line:  rgba(201,169,97,0.45);

    --font-display: 'Fraunces', Georgia, serif;
    --font-body:    'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:    'JetBrains Mono', 'Courier New', monospace;

    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ==========================================================
     RESET & BASE
     ========================================================== */
  *, *::before, *::after{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img{ max-width:100%; display:block; }
  a{ color: inherit; }

  ::selection{ background: var(--gold-soft); color: var(--gold); }

  /* Accessible focus ring — visible on keyboard nav, silent for mouse users */
  :focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }

  /* Faint fixed backdrop texture: a hairline grid, quiet and printed-badge-like */
  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  /* ==========================================================
     SKIP LINK (accessibility)
     ========================================================== */
  .skip-link{
    position:absolute; left:-9999px; top:0;
    background: var(--gold); color:#14161c; font-weight:600;
    padding: 10px 16px; z-index: 999; border-radius: 0 0 8px 0;
  }
  .skip-link:focus{ left:0; }

  /* ==========================================================
     FIXED SIDE NAVIGATION — badge-clip dots
     ========================================================== */
  .side-nav{
    position: fixed;
    right: clamp(16px, 3vw, 36px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .side-nav .rail{
    width: 1px; height: 28px;
    background: var(--line-strong);
  }
  .side-nav .dot{
    position: relative;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--text-faint);
    cursor: pointer;
    padding: 0;
    transition: border-color .35s var(--ease), transform .35s var(--ease);
  }
  .side-nav .dot::after{
    content:"";
    position:absolute; inset: -10px;
  }
  .side-nav .dot .num{
    position: absolute;
    right: 22px; top: 50%; transform: translateY(-50%);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
    pointer-events: none;
  }
  .side-nav .dot:hover .num,
  .side-nav .dot:focus-visible .num{ opacity: 1; transform: translateY(-50%) translateX(-4px); }
  .side-nav .dot.active{
    border-color: var(--gold);
    background: var(--gold);
    transform: scale(1.15);
  }
  .side-nav .dot.active .num{ color: var(--gold); opacity: 1; }

  @media (max-width: 760px){
    .side-nav{ right: 10px; gap: 14px; }
    .side-nav .dot .num{ display:none; }
  }

  /* ==========================================================
     PROFILE SECTION — full-viewport badge panel
     ========================================================== */
  .profile{
    position: relative;
    min-height: 100svh;
    display: flex;
    align-items: center;
    padding: clamp(28px, 6vw, 72px) clamp(20px, 7vw, 96px);
    z-index: 1;
    border-bottom: 1px solid var(--line);
  }
  .profile:last-of-type{ border-bottom: none; }

  /* alternate panel tint so the eye registers a new "card" each scroll */
  .profile:nth-of-type(odd){ background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%); }
  .profile:nth-of-type(even){ background: linear-gradient(180deg, var(--ink-2) 0%, var(--ink) 100%); }

  .profile-inner{
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 45% 55%;
    align-items: center;
    gap: clamp(32px, 6vw, 72px);
  }

  /* ---- eyebrow / badge index --------------------------------- */
  .badge-eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 18px;
  }
  .badge-eyebrow .tick{ width: 22px; height: 1px; background: var(--gold-line); }

  /* ---- LEFT: photo column ------------------------------------ */
  .photo-col{ display:flex; justify-content:center; }
  .photo-frame{
    position: relative;
    width: min(380px, 100%);
    aspect-ratio: 4 / 5;
    border-radius: 18px;
    overflow: hidden;
    background: var(--panel-2);
    border: 1px solid var(--line-strong);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.55),
      0 0 0 1px rgba(0,0,0,0.2);
  }
  .photo-frame img{
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center;
    filter: grayscale(0.15) contrast(1.03);
  }
  /* thin brass corner ticks — the "credential" signature detail */
  .photo-frame .corner{
    position: absolute; width: 22px; height: 22px;
    border: 1.5px solid var(--gold);
    opacity: 0.85;
    pointer-events:none;
  }
  .photo-frame .corner.tl{ top:10px; left:10px; border-right:none; border-bottom:none; }
  .photo-frame .corner.br{ bottom:10px; right:10px; border-left:none; border-top:none; }

  .photo-frame .id-strip{
    position:absolute; left:0; right:0; bottom:0;
    padding: 10px 14px;
    display:flex; justify-content:space-between; align-items:center;
    background: linear-gradient(0deg, rgba(10,11,14,0.88), rgba(10,11,14,0));
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }
  .photo-frame .id-strip .status{ color: var(--gold); }
  .photo-frame .id-strip .status i{ font-size: 8px; margin-right: 5px; }

  /* ---- RIGHT: info column -------------------------------------- */
  .info-col{ min-width: 0; }

  .name{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.4vw, 3.4rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .role{
    font-size: clamp(1rem, 1.6vw, 1.15rem);
    color: var(--gold);
    font-weight: 500;
    margin: 0 0 20px;
  }
  .desc{
    font-size: 1rem;
    line-height: 1.65;
    color: var(--text-dim);
    max-width: 52ch;
    margin: 0 0 30px;
  }

  .divider{
    height: 1px;
    background: var(--line-strong);
    margin: 0 0 28px;
  }

  /* ---- QR + socials block --------------------------------------- */
  .connect-row{
    display: flex;
    align-items: flex-start;
    gap: 32px;
    flex-wrap: wrap;
  }

  .qr-block{
    display:flex; flex-direction:column; align-items:flex-start; gap: 10px;
  }
  .qr-frame{
    position: relative;
    padding: 18px;
    background: #f4f2ec; /* light card so the QR stays scannable */
    border-radius: 16px;
    border: 1px solid var(--gold-line);
    box-shadow: 0 22px 50px -18px rgba(0,0,0,0.6);
    width: 236px; height: 236px;
    display:flex; align-items:center; justify-content:center;
  }
  .qr-frame canvas, .qr-frame img{ border-radius: 6px; width: 100% !important; height: 100% !important; }
  .qr-caption{
    font-family: var(--font-mono);
    font-size: 12.5px;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    max-width: 220px;
  }
  @media (max-width: 480px){
    .qr-frame{ width: 200px; height: 200px; }
  }
  .qr-caption strong{ color: var(--text-dim); font-weight: 500; display:block; margin-bottom:2px; }

  .social-col{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .social-link{
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--panel);
    text-decoration: none;
    color: var(--text);
    font-size: 0.92rem;
    font-weight: 500;
    transition: border-color .3s var(--ease), transform .3s var(--ease), background .3s var(--ease);
  }
  .social-link i{
    width: 18px; text-align:center;
    color: var(--gold);
    font-size: 0.95rem;
  }
  .social-link:hover, .social-link:focus-visible{
    border-color: var(--gold-line);
    background: var(--panel-2);
    transform: translateX(4px);
  }
  .social-link .handle{ color: var(--text-faint); font-weight: 400; }

  /* ==========================================================
     SCROLL-REVEAL ANIMATION STATES (JS toggles .is-visible)
     ========================================================== */
  .anim-photo{ opacity:0; transform: translateY(24px) scale(0.98); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .anim-text > *{ opacity:0; transform: translateY(16px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .anim-text > *:nth-child(1){ transition-delay: .05s; }
  .anim-text > *:nth-child(2){ transition-delay: .12s; }
  .anim-text > *:nth-child(3){ transition-delay: .19s; }
  .anim-text > *:nth-child(4){ transition-delay: .26s; }
  .anim-text > *:nth-child(5){ transition-delay: .33s; }
  .anim-qr{ opacity:0; transform: translateY(14px) scale(0.96); transition: opacity .7s var(--ease) .3s, transform .7s var(--ease) .3s; }

  .profile.is-visible .anim-photo{ opacity:1; transform: translateY(0) scale(1); }
  .profile.is-visible .anim-text > *{ opacity:1; transform: translateY(0); }
  .profile.is-visible .anim-qr{ opacity:1; transform: translateY(0) scale(1); }

  /* ==========================================================
     RESPONSIVE — MOBILE STACK
     ========================================================== */
  @media (max-width: 860px){
    .profile-inner{
      grid-template-columns: 1fr;
      text-align: center;
      justify-items: center;
    }
    .badge-eyebrow{ justify-content:center; }
    .desc{ max-width: 44ch; }
    .connect-row{ justify-content: center; }
    .qr-block{ align-items: center; text-align:center; }
    .social-col{ align-items: center; }
    .divider{ width: 100%; }
    .photo-frame{ width: min(300px, 78vw); }
  }

  @media (max-width: 420px){
    .connect-row{ flex-direction: column; }
  }

  /* Prevent any horizontal overflow site-wide */
  html, body{ max-width: 100%; overflow-x: hidden; }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<!-- ============================================================
     FIXED SIDE NAVIGATION
     ============================================================ -->
<nav class="side-nav" aria-label="Jump to profile">
  <!-- dots injected by JS, generated from the profiles array -->
</nav>

<main id="main">
  <!-- Profile sections are rendered entirely by JavaScript from the
       `profiles` data array below, so there is zero duplicated markup. -->
</main>

<script>
/* ================================================================
   CONFIGURATION
   Edit these two things and the whole site updates automatically.
   ================================================================ */

// 1) Set this to your published GitHub Pages URL (include trailing slash).
//    Each QR code is generated from BASE_URL + "#personN".
const BASE_URL = "https://YOUR-GITHUB-USERNAME.github.io/YOUR-REPOSITORY/";

// 2) Edit names, roles, descriptions, images and social URLs here.
//    This is the ONLY place you should need to change content.
// Each entry has a flexible `links` array (not just LinkedIn/GitHub/Instagram),
// so you can mix in things like Website, LeetCode, Codolio, or email per entry.
// `icon` is any Font Awesome class string: https://fontawesome.com/icons
const profiles = [
  // -- Brand / company card, shown first, before all individual profiles --
  {
    id: "intervista",
    name: "Intervista AI",
    role: "www.intervistaai.com",
    description: "Presented by Intervista AI. Follow us for updates, and connect with the team members below.",
    image: "static/images/intervista.png",
    links: [
      { label: "Website",   handle: "intervistaai.com",  url: "https://www.intervistaai.com", icon: "fa-solid fa-globe" },
      { label: "LinkedIn",  handle: "intervistaai",      url: "https://www.linkedin.com/company/intervistaai/", icon: "fa-brands fa-linkedin" },
      { label: "Instagram", handle: "intervistaai",      url: "https://www.instagram.com/intervistaai?igsh=MXdlOHpnZ2txc3hhOQ==", icon: "fa-brands fa-instagram" }
    ]
  },
  {
    id: "person1",
    name: "Pranav Sahu",
    role: "Data Scientist",
    description: "Building clean, reliable products end to end — from backend architecture to the small interface details that make software feel considered.",
    image: "static/images/1.png",
    links: [
      { label: "LinkedIn",  handle: "pranav-sahu-37ab7b35a", url: "https://www.linkedin.com/in/pranav-sahu-37ab7b35a", icon: "fa-brands fa-linkedin" },
      { label: "GitHub",    handle: "hitmanp007",            url: "https://github.com/hitmanp007", icon: "fa-brands fa-github" },
      { label: "Instagram", handle: "am_i_engineer_007",     url: "https://www.instagram.com/am_i_engineer_007/", icon: "fa-brands fa-instagram" }
    ]
  },
  {
    id: "person2",
    name: "Bhavesh Yadav",
    role: "Software Developer",
    description: "Turning messy data into decisions. Focused on experimentation, structured problem-solving, and building things that hold up outside the notebook.",
    image: "static/images/2.jpeg",
    links: [
      { label: "LinkedIn",  handle: "bhaveshyadav19",     url: "https://www.linkedin.com/in/bhaveshyadav19/", icon: "fa-brands fa-linkedin" },
      { label: "GitHub",    handle: "Bhavesh-yadav-dev",  url: "https://github.com/Bhavesh-yadav-dev", icon: "fa-brands fa-github" },
      { label: "LeetCode",  handle: "zYPogkR6Vx",         url: "https://leetcode.com/u/zYPogkR6Vx/", icon: "fa-solid fa-code" },
      { label: "Codolio",   handle: "bhavesh_yadav",      url: "https://codolio.com/profile/bhavesh_yadav", icon: "fa-solid fa-chart-line" },
      { label: "Instagram", handle: "_bhavesh__yadu__",   url: "https://www.instagram.com/_bhavesh__yadu__/", icon: "fa-brands fa-instagram" }
    ]
  },
  {
    id: "person3",
    name: "Prem Dilliwar",
    role: "Flutter Developer",
    description: "Designing and shipping software with an eye for both the engineering and the craft — from idea to a finished, working product.",
    image: "static/images/3.png",
    links: [
      { label: "LinkedIn",  handle: "prem-dilliwar-40425a376", url: "https://www.linkedin.com/in/prem-dilliwar-40425a376", icon: "fa-brands fa-linkedin" },
      { label: "GitHub",    handle: "prem-create",             url: "https://github.com/prem-create/", icon: "fa-brands fa-github" },
      { label: "Instagram", handle: "prem_dilliwar",           url: "https://www.instagram.com/prem_dilliwar", icon: "fa-brands fa-instagram" },
      { label: "Email",     handle: "premdilliwar31@gmail.com", url: "mailto:premdilliwar31@gmail.com", icon: "fa-solid fa-envelope" }
    ]
  },
  {
    id: "person4",
    name: "Himanshu Jadhav",

    image: "static/images/4.jpeg",
    links: [
      { label: "LinkedIn",  handle: "himanshu-jadhav-08a6a4345", url: "https://www.linkedin.com/in/himanshu-jadhav-08a6a4345?utm_source=share_via&utm_content=profile&utm_medium=member_ios", icon: "fa-brands fa-linkedin" },
      { label: "Instagram", handle: "masterlessmind",            url: "https://www.instagram.com/masterlessmind?igsi=ZXp3ODdvc3hxazh6&utm_source=qr", icon: "fa-brands fa-instagram" }
    ]
  },
  {
    id: "person5",
    name: "Tilak Sahu",
    role: "photgraphy & VideoGraphy",
    description: "Building full-stack products and exploring ideas across hackathons and entrepreneurship, with a focus on clean, practical engineering.",
    image: "static/images/5.jpeg",
    links: [
      { label: "LinkedIn",  handle: "tilak-sahu-190406361", url: "https://www.linkedin.com/in/tilak-sahu-190406361/", icon: "fa-brands fa-linkedin" },
      { label: "Instagram", handle: "13_tilak_",            url: "https://www.instagram.com/13_tilak_/", icon: "fa-brands fa-instagram" }
    ]
  }
];

/* ================================================================
   RENDER
   Builds the nav dots and profile sections from `profiles`.
   ================================================================ */
const mainEl = document.getElementById("main");
const navEl = document.querySelector(".side-nav");

function badgeNumber(index){
  return String(index + 1).padStart(2, "0");
}

profiles.forEach((p, i) => {
  const num = badgeNumber(i);
  const profileUrl = BASE_URL + "#" + p.id;

  /* ---- nav dot ---- */
  const dot = document.createElement("button");
  dot.className = "dot" + (i === 0 ? " active" : "");
  dot.type = "button";
  dot.setAttribute("aria-label", "Go to " + p.name);
  dot.dataset.target = p.id;
  dot.innerHTML = `<span class="num">P${num} — ${p.name.split(" ")[0]}</span>`;
  navEl.appendChild(dot);
  if (i < profiles.length - 1) {
    const rail = document.createElement("div");
    rail.className = "rail";
    navEl.appendChild(rail);
  }

  /* ---- profile section ---- */
  const section = document.createElement("section");
  section.className = "profile";
  section.id = p.id;
  section.setAttribute("aria-label", p.name + " profile");

  section.innerHTML = `
    <div class="profile-inner">
      <div class="photo-col anim-photo">
        <div class="photo-frame">
          <span class="corner tl" aria-hidden="true"></span>
          <span class="corner br" aria-hidden="true"></span>
          <img src="${p.image}" alt="Portrait photo of ${p.name}" loading="lazy" />
          <div class="id-strip">
            <span class="status"><i class="fa-solid fa-circle"></i>ATTENDEE</span>
            <span>NO. ${num}</span>
          </div>
        </div>
      </div>

      <div class="info-col">
        <div class="badge-eyebrow"><span class="tick"></span> Digital Profile — ${num} / ${badgeNumber(profiles.length - 1)}</div>
        <div class="anim-text">
          <h1 class="name">${p.name}</h1>
          <p class="role">${p.role}</p>
          <p class="desc">${p.description}</p>
          <div class="divider"></div>
          <div class="connect-row">
            <div class="qr-block anim-qr">
              <div class="qr-frame" id="qr-${p.id}" role="img" aria-label="QR code linking to ${p.name}'s digital contact card with all social links"></div>
              <p class="qr-caption"><strong>Scan to connect</strong>Opens all social links below</p>
            </div>
            <div class="social-col">
              ${p.links.map(link => `
              <a class="social-link" href="${link.url}" target="_blank" rel="noopener noreferrer">
                <i class="${link.icon}"></i> ${link.label}
              </a>`).join("")}
            </div>
          </div>
        </div>
      </div>
    </div>
  `;

  mainEl.appendChild(section);

  /* ---- generate this entry's QR code (client-side, no backend) ---- */
  // eslint-disable-next-line no-new
  new QRCode(document.getElementById("qr-" + p.id), {
    text: profileUrl,
    width: 220,
    height: 220,
    colorDark: "#14161c",
    colorLight: "#f4f2ec",
    correctLevel: QRCode.CorrectLevel.M
  });
});

/* ================================================================
   ACTIVE-DOT TRACKING + SCROLL-REVEAL ANIMATIONS
   ================================================================ */
const sections = Array.from(document.querySelectorAll(".profile"));
const dots = Array.from(document.querySelectorAll(".side-nav .dot"));

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const idx = sections.indexOf(entry.target);
    if (entry.isIntersecting){
      entry.target.classList.add("is-visible");
    }
    if (entry.intersectionRatio > 0.5){
      dots.forEach(d => d.classList.remove("active"));
      if (dots[idx]) dots[idx].classList.add("active");
    }
  });
}, { threshold: [0, 0.5, 0.75] });

sections.forEach(s => observer.observe(s));

/* ---- dot click / keyboard navigation -> smooth scroll ---- */
dots.forEach(dot => {
  dot.addEventListener("click", () => {
    const target = document.getElementById(dot.dataset.target);
    if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

/* ================================================================
   HASH ROUTING
   Supports index.html#intervista / #person1 / #person2 / etc — this
   is what each QR code encodes, so scanning a code jumps straight to
   that entry's card, whether the page is freshly loaded or already open.
   ================================================================ */
function scrollToHash(){
  const id = window.location.hash.replace("#", "");
  if (!id) return;
  const target = document.getElementById(id);
  if (target){
    // slight delay lets layout/fonts settle on first paint
    requestAnimationFrame(() => target.scrollIntoView({ behavior: "smooth", block: "start" }));
  }
}
window.addEventListener("hashchange", scrollToHash);
window.addEventListener("load", scrollToHash);
</script>
</body>
